name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DATABASE_URL: mysql+pymysql://tourvaa:tourvaa_ci@127.0.0.1:3306/tourvaa_ci
  JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-characters
  SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  SUPER_ADMIN_EMAIL: admin@tourvaa.com
  SUPER_ADMIN_PASSWORD: Admin@123
  SUPER_ADMIN_RESET_PASSWORD_ON_STARTUP: "false"
  APP_ENV: development
  APP_DEBUG: "false"
  FRONTEND_URL: http://127.0.0.1:3000
  ALLOWED_ORIGINS: http://127.0.0.1:3000
  REQUIRE_EMAIL_VERIFICATION: "false"

jobs:
  quality:
    name: Migrations and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tourvaa_ci
          MYSQL_USER: tourvaa
          MYSQL_PASSWORD: tourvaa_ci
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m alembic upgrade head
      - run: python -m alembic current --check-heads

      - name: Start API and wait for health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: Run API suite
        run: python -m pytest -q

      - name: Show API log after failure
        if: failure()
        run: cat api.log || true

  container:
    name: Build, scan and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build scan candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tourvaa-backend-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publication
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tourvaa-backend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

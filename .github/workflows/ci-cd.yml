name: Backend CI/CD

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DATABASE_URL: mysql+pymysql://tourvaa:tourvaa_ci@127.0.0.1:3306/tourvaa_ci
  JWT_SECRET_KEY: ci-only-jwt-secret-that-is-longer-than-32-characters
  SETTINGS_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  SUPER_ADMIN_EMAIL: admin@tourvaa.com
  SUPER_ADMIN_PASSWORD: Admin@123
  SUPER_ADMIN_RESET_PASSWORD_ON_STARTUP: "false"
  APP_ENV: development
  APP_DEBUG: "false"
  FRONTEND_URL: http://127.0.0.1:3000
  ALLOWED_ORIGINS: http://127.0.0.1:3000
  REQUIRE_EMAIL_VERIFICATION: "false"

jobs:
  quality:
    name: Migrations and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: tourvaa_ci
          MYSQL_USER: tourvaa
          MYSQL_PASSWORD: tourvaa_ci
          MYSQL_ROOT_PASSWORD: root_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m alembic upgrade head
      - run: python -m alembic current --check-heads

      - name: Start API and wait for health
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo $! > api.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat api.log
          exit 1

      - name: API suite batch 1 (test_01-test_10)
        if: always()
        run: python -m pytest -q tests/test_0[1-9]_* tests/test_10_*
      - name: B2 - 11_cities
        if: always()
        run: python -m pytest -q tests/test_11_cities.py
      - name: B2 - 12_tour_categories
        if: always()
        run: python -m pytest -q tests/test_12_tour_categories.py
      - name: B2 - 13_tour_subcategories
        if: always()
        run: python -m pytest -q tests/test_13_tour_subcategories.py
      - name: B2 - 14_basic_tours
        if: always()
        run: python -m pytest -q tests/test_14_basic_tours.py
      - name: B2 - 15_advanced_tour_cms
        if: always()
        run: python -m pytest -q tests/test_15_advanced_tour_cms.py
      - name: B2 - 16_tour_pricing
        if: always()
        run: python -m pytest -q tests/test_16_tour_pricing.py
      - name: B2 - 17_tour_calendar
        if: always()
        run: python -m pytest -q tests/test_17_tour_calendar.py
      - name: B2 - 18_tour_discounts
        if: always()
        run: python -m pytest -q tests/test_18_tour_discounts.py
      - name: B2 - 19_uploads
        if: always()
        run: python -m pytest -q tests/test_19_uploads.py
      - name: B2 - 20_bookings
        if: always()
        run: python -m pytest -q tests/test_20_bookings.py
      - name: B3 - 21_supplier_acceptance
        if: always()
        run: python -m pytest -q tests/test_21_supplier_acceptance.py
      - name: B3 - 22_payments
        if: always()
        run: python -m pytest -q tests/test_22_payments.py
      - name: B3 - 23_invoices
        if: always()
        run: python -m pytest -q tests/test_23_invoices.py
      - name: B3 - 24_communications
        if: always()
        run: python -m pytest -q tests/test_24_communications.py
      - name: B3 - 25_notifications_reports_sessions
        if: always()
        run: python -m pytest -q tests/test_25_notifications_reports_sessions.py
      - name: B3 - 26_handover_guards
        if: always()
        run: python -m pytest -q tests/test_26_handover_guards.py
      - name: B3 - 26a_states
        if: always()
        run: python -m pytest -q tests/test_26a_states.py
      - name: B3 - 27_geo_reference
        if: always()
        run: python -m pytest -q tests/test_27_geo_reference.py
      - name: B3 - 28_public_settings
        if: always()
        run: python -m pytest -q tests/test_28_public_settings.py
      - name: B3 - 29_chatbot
        if: always()
        run: python -m pytest -q tests/test_29_chatbot.py
      - name: B3 - 30_cancellations
        if: always()
        run: python -m pytest -q tests/test_30_cancellations.py
      - name: API suite batch 4 (test_31-test_40)
        if: always()
        run: python -m pytest -q tests/test_3[1-9]_* tests/test_40_*
      - name: B5 - 41_affiliate_module_v2
        if: always()
        run: python -m pytest -q tests/test_41_affiliate_module_v2.py
      - name: B5 - 42_reviews
        if: always()
        run: python -m pytest -q tests/test_42_reviews.py
      - name: B5 - 43_admin_reports
        if: always()
        run: python -m pytest -q tests/test_43_admin_reports.py
      - name: B5 - 44_payment_workflow_e2e
        if: always()
        run: python -m pytest -q tests/test_44_payment_workflow_e2e.py
      - name: B6 - auth_login_lockout_unit
        if: always()
        run: python -m pytest -q tests/test_auth_login_lockout_unit.py
      - name: B6 - booking_flow_unit
        if: always()
        run: python -m pytest -q tests/test_booking_flow_unit.py
      - name: B6 - checkout_flow_unit
        if: always()
        run: python -m pytest -q tests/test_checkout_flow_unit.py
      - name: B6 - currency_unit
        if: always()
        run: python -m pytest -q tests/test_currency_unit.py
      - name: B6 - dashboard_role_based
        if: always()
        run: python -m pytest -q tests/test_dashboard_role_based.py
      - name: B6 - dashboard_summary_unit
        if: always()
        run: python -m pytest -q tests/test_dashboard_summary_unit.py
      - name: B6 - invoice_gst_unit
        if: always()
        run: python -m pytest -q tests/test_invoice_gst_unit.py
      - name: B6 - registration_activation_unit
        if: always()
        run: python -m pytest -q tests/test_registration_activation_unit.py
      - name: B6 - registration_policy_unit
        if: always()
        run: python -m pytest -q tests/test_registration_policy_unit.py
      - name: B6 - registration_token_security_unit
        if: always()
        run: python -m pytest -q tests/test_registration_token_security_unit.py
      - name: B6 - supplier_approval_policy_unit
        if: always()
        run: python -m pytest -q tests/test_supplier_approval_policy_unit.py
      - name: B6 - user_account_lifecycle_unit
        if: always()
        run: python -m pytest -q tests/test_user_account_lifecycle_unit.py

      - name: Show API log after failure
        if: failure()
        run: cat api.log || true

  container:
    name: Build, scan and publish image
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build scan candidate
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tourvaa-backend-ci:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image before publication
        uses: aquasecurity/trivy-action@0.32.0
        with:
          image-ref: tourvaa-backend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Publish verified image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
